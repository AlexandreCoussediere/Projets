<svg width="520" height="320" xmlns="http://www.w3.org/2000/svg">

  <!-- Triangle principal A-E et sommet C -->
  <line x1="100" y1="260" x2="420" y2="260" stroke="black" stroke-width="2"></line>
  <line x1="100" y1="260" x2="260" y2="40" stroke="black" stroke-width="2"></line>
  <line x1="420" y1="260" x2="260" y2="40" stroke="black" stroke-width="2"></line>

  <!-- Segment BC -->
  <line x1="170" y1="160" x2="350" y2="160" stroke="black" stroke-width="2"></line>

  <!-- Points -->
  <circle cx="100" cy="260" r="3"></circle>
  <circle cx="420" cy="260" r="3"></circle>
  <circle cx="350" cy="160" r="3"></circle>
  <circle cx="170" cy="160" r="3"></circle>
  <circle cx="260" cy="40" r="3"></circle>

  <!-- Labels -->
  <text x="85" y="280" font-size="16">A</text>
  <text x="425" y="280" font-size="16">E</text>
  <text x="355" y="155" font-size="16">D</text>
  <text x="155" y="155" font-size="16">B</text>
  <text x="252" y="30" font-size="16">C</text>

  <!-- Mesures -->
  <!-- AB = 4 cm -->
  <text x="140" y="210" font-size="14">4 cm</text>

  <!-- AC = 6 cm (correctement sur le côté gauche du triangle) -->
  <text x="185" y="135" font-size="14">6 cm</text>

  <!-- AE = 10 cm -->
  <text x="250" y="300" font-size="14">10 cm</text>

</svg>